<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login or register for the IIITDM Smart Campus Gym Management System.">
    <title>Login — CampusGym</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Background Glows -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <!-- ─── Navbar ──────────────────────────────────── -->
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="12" width="24" height="4" rx="2" fill="#3b82f6"/>
                <rect x="5" y="6" width="4" height="16" rx="2" fill="#6366f1"/>
                <rect x="19" y="6" width="4" height="16" rx="2" fill="#6366f1"/>
                <circle cx="3" cy="8" r="3" fill="#3b82f6"/>
                <circle cx="25" cy="8" r="3" fill="#3b82f6"/>
                <circle cx="3" cy="20" r="3" fill="#3b82f6"/>
                <circle cx="25" cy="20" r="3" fill="#3b82f6"/>
            </svg>
            <span>Campus<span class="gradient-text">Gym</span></span>
        </a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
        </div>
    </nav>

    <!-- ─── Auth Container ──────────────────────────── -->
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 80px 24px 40px;">
        <div class="glass-card animate-fade-in-up" style="max-width: 440px; width: 100%; padding: 40px;">

            <!-- Header -->
            <div style="text-align: center; margin-bottom: 32px;">
                <h1 style="font-size: 1.8rem; font-weight: 700; margin-bottom: 8px;">
                    Welcome <span class="gradient-text">Back</span>
                </h1>
                <p style="color: var(--text-secondary); font-size: 0.9rem;">
                    Sign in to track your gym sessions
                </p>
            </div>

            <!-- Tab Toggle -->
            <div class="tab-toggle" style="margin-bottom: 28px;">
                <button id="login-tab" class="tab-btn active" type="button">Login</button>
                <button id="register-tab" class="tab-btn" type="button">Register</button>
            </div>

            <!-- Login Form -->
            <div id="login-form">
                <form id="login-form-el" autocomplete="on">
                    <div class="form-group">
                        <label class="form-label" for="login-email">Email Address</label>
                        <input type="email" id="login-email" class="form-input" placeholder="you@iiitdm.ac.in" required autocomplete="email">
                        <div class="form-error" style="display: none;"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="login-password">Password</label>
                        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                        <div class="form-error" style="display: none;"></div>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%; padding: 14px;">
                        Sign In
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="hidden">
                <form id="register-form-el" autocomplete="on">
                    <div class="form-group">
                        <label class="form-label" for="reg-name">Full Name</label>
                        <input type="text" id="reg-name" class="form-input" placeholder="John Doe" required autocomplete="name">
                        <div class="form-error" style="display: none;"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-roll">Roll Number</label>
                        <input type="text" id="reg-roll" class="form-input" placeholder="CS22B1001" required>
                        <div class="form-error" style="display: none;"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-email">Email Address</label>
                        <input type="email" id="reg-email" class="form-input" placeholder="you@iiitdm.ac.in" required autocomplete="email">
                        <div class="form-error" style="display: none;"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-password">Password</label>
                        <input type="password" id="reg-password" class="form-input" placeholder="Min 6 characters" required autocomplete="new-password">
                        <div class="form-error" style="display: none;"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="reg-confirm-password">Confirm Password</label>
                        <input type="password" id="reg-confirm-password" class="form-input" placeholder="••••••••" required autocomplete="new-password">
                        <div class="form-error" style="display: none;"></div>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%; padding: 14px;">
                        Create Account
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                    </button>
                </form>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="js/supabase-config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>

    <style>
        .hidden { display: none !important; }
    </style>
</body>
</html>
